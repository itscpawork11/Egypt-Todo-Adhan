name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check Repository Structure
        run: |
          echo "=== محتويات المستودع الحالية ==="
          ls -la
          echo "=================================="

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # تثبيت أداة Gradle الرسمية
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true # تعطيل الكاش مؤقتاً لتجنب خطأ 400

      # كشف ملفات Gradle وتشغيل البناء
      - name: Build APK
        run: |
          # التأكد من وجود wrapper أو توليده
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
